<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 - Dynamic Web Fundamentals - Amenaghawon Imuetinyan Favour</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <meta name="description" content="WDD 131 - Dynamic Web Fundamentals Amenaghawon Imuetinyan Favour Form page">
    <meta name="author" content="Amenaghawon Imuetinyan Favour">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header><h1>Product Review</h1></header>
    <form method="get" action="review.html" class="review-form">
        <div>Product Name</div>
        <select id="review" name="review" required>
            <option value="" disabled selected>Choose a Product...</option>
        </select>
        <div class="rating-box">
            <div>Overall Rating</div>
            <div class="rating-container">
                <label><input type="radio" id="onestar" name="stars" value="1" required>&star;</label>
                <label><input type="radio" id="twostar" name="stars" value="2" required>&star; &star;</label>
                <label><input type="radio" id="threestar" name="stars" value="3" required>&star; &star; &star;</label>
                <label><input type="radio" id="fourstar" name="stars" value="4" required>&star; &star; &star; &star;</label>
                <label><input type="radio" id="fivestar" name="stars" value="5" required>&star; &star; &star; &star; &star;</label>
                </div>
        </div>
            

    <div>Date Of Installation</div>
    <label><input type="date" id="install-date" name="install-date" required></label>

    <div>Which features did you find most useful in the product?
        (check all that apply)</div>
    </div>
    <label><input type="checkbox" id="durability" name="durability" value="yes"> Durability</label>
    <label><input type="checkbox" id="simplicity" name="simplicity" value="feature2"> Ease of use</label>
    <label><input type="checkbox" id="performance" name="performance" value="feature3"> Performance</label>
    <label><input type="checkbox" id="design" name="design" value="feature4"> Design</label>

    <div>Written Review (optional)</div>
    <label><textarea id="review-text" name="review-text" rows="4" cols="40"></textarea></label>

    <div>Your Name(optional)</div>
    <label><input type="text" id="name" name="name"></label>

    <input type="submit" value="Post review">
    </form>

    <footer>
        <p>
            &copy;<span id="currentyear"></span> 🌴 Amenaghawon Imuetinyan Favour 🌴 Nigeria
        </p>
        <p id="lastmodified"></p>
    </footer>
</body>
</html>
